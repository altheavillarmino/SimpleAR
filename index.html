<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AR Hunt</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #message {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 5px black;
        }
    </style>
</head>

<body>

    <div id="message">
        SOMEONE IS LOOKING AT YOU 👀 FIND THE MUMU!
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false">

        <!-- Assets -->
        <a-assets>
            <img id="mumu" src="assets/mumu.png">
        </a-assets>


        <!-- The marker -->
        <a-marker preset="hiro">

            <!-- Ghost -->
            <a-image
                src="#mumu"
                position="0 1.5 0"
                width="8"
                height="8"
                rotation="-90 0 0"
                animation="property: position;
                        dir: alternate;
                        dur: 1000;
                        loop: true;
                        to: 0 1.3 0">
            </a-image>

            <!-- Floating text 
            <a-text
                value="PAHINGI PO NG HUSTISYA!!!"
                align="center"
                color="#ff0000"
                scale="1.5 1.5 1.5"
                position="0 2.3 0">
            </a-text>-->

        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
